syntax = "proto3";
package acme.logistics;

// Produced as plain Protobuf (no Schema Registry): bind topic shipment-pb to
// acme.logistics.Shipment in MidDeck to read it.
message Shipment {
  string shipment_id = 1;
  string order_id = 2;
  string carrier = 3;
  repeated Checkpoint checkpoints = 4;
  // Snowflake-style IDs exceed 2^53; MidDeck must keep every digit.
  int64 tracking_seq = 5;

  message Checkpoint {
    string city = 1;
    int64 at_unix = 2;
  }
}
