# Local playground for MidDeck development and demos.
#
#   docker compose -f dev/docker-compose.yml up -d
#   ./dev/seed.sh
#
# Direct access from the host:  Kafka localhost:9092 · Redis localhost:6379 ·
#                               RabbitMQ localhost:5672 / http://localhost:15672 (guest/guest) ·
#                               Schema Registry http://localhost:8081
# Through the SSH jump host (ops / middeck @ localhost:2222):
#                               Kafka kafka:19092 · Redis redis:6379 ·
#                               Schema Registry http://schema-registry:8081 — these names only
#                               resolve inside the Docker network, like a real intranet.
name: middeck-dev

services:
  kafka:
    image: apache/kafka:3.9.0
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: HOST://:9092,INTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,INTERNAL://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: HOST:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  schema-registry:
    image: confluentinc/cp-schema-registry:7.9.0
    ports: ["8081:8081"]
    depends_on: [kafka]
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:19092

  redis:
    image: redis:7.4-alpine
    ports: ["6379:6379"]

  rabbitmq:
    image: rabbitmq:3.13-management
    ports: ["5672:5672", "15672:15672"]

  # Minimal SSH bastion: password login, TCP forwarding allowed.
  jump:
    image: redis:7.4-alpine
    ports: ["2222:22"]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        apk add --no-cache openssh >/dev/null &&
        ssh-keygen -A >/dev/null &&
        (id ops >/dev/null 2>&1 || adduser -D -s /bin/sh ops) && echo 'ops:middeck' | chpasswd &&
        sed -i 's/^#\?AllowTcpForwarding.*/AllowTcpForwarding yes/; s/^#\?PasswordAuthentication.*/PasswordAuthentication yes/' /etc/ssh/sshd_config &&
        exec /usr/sbin/sshd -D -e
