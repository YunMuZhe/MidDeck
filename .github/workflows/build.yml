name: Build

# Push to main / open a PR  -> build all platforms, packages kept as workflow artifacts (7 days)
# Push a tag like v0.1.0     -> build all platforms (plus headless Linux servers) and publish a GitHub Release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  WAILS_VERSION: v2.17.1
  NODE_VERSION: '20'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Go vet & test
        run: |
          go vet ./internal/...
          go test ./internal/...
          # The main package needs frontend/dist only for the GUI; the headless build checks it without.
          go vet -tags headless .
          go test -tags headless .
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend type-check & build
        working-directory: frontend
        run: |
          npm ci
          npm run i18n:check
          npm run build

  # Runs the drivers against real servers. Every version here must be listed as
  # "tested" in internal/compat/compat.go (the test asserts it).
  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { kafka: '3.9.0', redis: '6.2', rabbit: '3.13-management', expect_kafka: '3.9', expect_redis: '6.2', expect_rabbit: '3.13' }
          - { kafka: '4.0.0', redis: '7.4', rabbit: '4.1-management', expect_kafka: '4.0', expect_redis: '7.4', expect_rabbit: '4.1' }
    services:
      kafka:
        image: apache/kafka:${{ matrix.kafka }}
        ports: ['9092:9092']
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"
          --health-interval 10s --health-timeout 10s --health-retries 15
      redis:
        image: redis:${{ matrix.redis }}
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
      rabbit:
        image: rabbitmq:${{ matrix.rabbit }}
        ports: ['5672:5672', '15672:15672']
        options: --health-cmd "rabbitmq-diagnostics -q ping" --health-interval 10s --health-timeout 10s --health-retries 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Integration tests
        env:
          MIDDECK_KAFKA: localhost:9092
          MIDDECK_REDIS: localhost:6379
          MIDDECK_RABBIT_MGMT: http://localhost:15672
          MIDDECK_RABBIT_AMQP: localhost:5672
          MIDDECK_EXPECT_KAFKA: ${{ matrix.expect_kafka }}
          MIDDECK_EXPECT_REDIS: ${{ matrix.expect_redis }}
          MIDDECK_EXPECT_RABBIT: ${{ matrix.expect_rabbit }}
        # Failing lines are re-emitted as ::error:: annotations so they show up on the run summary.
        run: |
          set -o pipefail
          go test -tags integration -v -count=1 ./internal/integration/ 2>&1 | tee test.log || {
            grep -E 'integration_test.go:[0-9]+:|--- FAIL|panic' test.log | head -20 | sed 's/^[[:space:]]*/::error::/'
            exit 1
          }

  build:
    needs: [test, integration]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin/universal
            name: macos-universal
          - os: windows-latest
            platform: windows/amd64
            name: windows-amd64
          - os: windows-latest
            platform: windows/arm64
            name: windows-arm64
          - os: ubuntu-24.04
            platform: linux/amd64
            name: linux-amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Version
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Ensure NSIS
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) { choco install nsis -y --no-progress }
          # A fresh install is not on PATH for later steps until we add it.
          "${env:ProgramFiles(x86)}\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "$env:ProgramFiles\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build
        shell: bash
        run: |
          FLAGS=""
          [[ "$RUNNER_OS" == "Windows" ]] && FLAGS="-nsis"
          [[ "$RUNNER_OS" == "Linux" ]] && FLAGS="-tags webkit2_41"
          wails build -clean -trimpath -platform ${{ matrix.platform }} $FLAGS \
            -ldflags "-s -w -X main.version=${{ steps.ver.outputs.version }}"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist
          cd build/bin
          ditto -c -k --keepParent MidDeck.app "../../dist/MidDeck-${{ steps.ver.outputs.version }}-${{ matrix.name }}.zip"
          hdiutil create -volname MidDeck -srcfolder MidDeck.app -ov -format UDZO \
            "../../dist/MidDeck-${{ steps.ver.outputs.version }}-${{ matrix.name }}.dmg"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          V=${{ steps.ver.outputs.version }}
          echo "build/bin contents:"; ls -la build/bin
          exe=$(find build/bin -maxdepth 1 -iname '*.exe' ! -iname '*installer*' | head -1)
          inst=$(find build -iname '*installer*.exe' | head -1)
          if [ -z "$exe" ]; then
            echo "::error::no application .exe in build/bin: $(ls build/bin | tr '\n' ' ')"; exit 1
          fi
          cp "$exe" "dist/MidDeck-$V-${{ matrix.name }}-portable.exe"
          if [ -n "$inst" ]; then
            cp "$inst" "dist/MidDeck-$V-${{ matrix.name }}-setup.exe"
          else
            echo "::warning::NSIS installer not found, shipping the portable exe only. build tree: $(find build -iname '*.exe' | tr '\n' ' ')"
          fi

      # Offline package: the portable exe plus a WebView2 Fixed Version runtime in
      # webview2\ next to it (picked up by webview_windows.go), for machines that
      # have no WebView2 and no internet, e.g. bastion hosts. Microsoft publishes the
      # runtime only as links embedded in its download page, so we scrape the newest.
      - name: Package offline (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $arch = if ('${{ matrix.platform }}' -eq 'windows/arm64') { 'arm64' } else { 'x64' }
          $v = '${{ steps.ver.outputs.version }}'
          try {
            $html = (Invoke-WebRequest -UseBasicParsing 'https://developer.microsoft.com/en-us/microsoft-edge/webview2/').Content -replace '\\u002F', '/'
            $pattern = 'msedge\.sf\.dl\.delivery\.mp\.microsoft\.com/filestreamingservice/files/[0-9a-fA-F-]+/Microsoft\.WebView2\.FixedVersionRuntime\.([\d.]+)\.' + $arch + '\.cab'
            $best = [regex]::Matches($html, $pattern) | Sort-Object { [version]$_.Groups[1].Value } -Descending | Select-Object -First 1
            if (-not $best) { throw "no Fixed Version $arch runtime link found on the WebView2 download page" }
            $wv = $best.Groups[1].Value
            Write-Host "WebView2 Fixed Version $wv ($arch)"
            Invoke-WebRequest -UseBasicParsing "https://$($best.Value)" -OutFile wv2.cab
            New-Item -ItemType Directory -Force wv2x | Out-Null
            expand.exe wv2.cab -F:* wv2x | Out-Null
            $exe = Get-ChildItem wv2x -Recurse -Filter msedgewebview2.exe | Select-Object -First 1
            if (-not $exe) { throw 'msedgewebview2.exe missing from the extracted runtime' }
            $src = $exe.Directory

            $stage = 'offline\MidDeck'
            New-Item -ItemType Directory -Force $stage | Out-Null
            Copy-Item "dist\MidDeck-$v-${{ matrix.name }}-portable.exe" "$stage\MidDeck.exe"
            Move-Item $src.FullName "$stage\webview2"
            "WebView2 Fixed Version Runtime $wv ($arch)`r`nRun MidDeck.exe; no installation or internet needed." | Out-File -Encoding utf8 "$stage\README.txt"
            7z a -tzip -mx=7 "dist\MidDeck-$v-${{ matrix.name }}-offline.zip" .\offline\MidDeck | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "7z failed ($LASTEXITCODE)" }
          } catch {
            # A release must not silently lose the offline package; other builds just warn.
            if ('${{ github.ref }}'.StartsWith('refs/tags/v')) { throw }
            Write-Host "::warning::offline package skipped: $_"
          }

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          tar -C build/bin -czf "dist/MidDeck-${{ steps.ver.outputs.version }}-${{ matrix.name }}.tar.gz" MidDeck

      - uses: actions/upload-artifact@v6
        with:
          name: MidDeck-${{ matrix.name }}
          path: dist/*
          retention-days: 7

  # The MCP server and changeset CLI for Linux servers: no window, no GTK / WebKit,
  # a static binary (CGO off) that runs on any distribution.
  headless:
    needs: [test, integration]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="$GITHUB_REF_NAME"; else V="dev-${GITHUB_SHA::7}"; fi
          echo "V=$V" >> "$GITHUB_ENV"
          mkdir -p out/MidDeck dist
          CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.arch }} go build -tags headless -trimpath \
            -ldflags "-s -w -X main.version=$V" -o out/MidDeck/MidDeck .
          cp docs/SERVER.md out/MidDeck/README.md
          tar -C out -czf "dist/MidDeck-$V-linux-${{ matrix.arch }}-headless.tar.gz" MidDeck
      - uses: actions/upload-artifact@v6
        with:
          name: MidDeck-linux-${{ matrix.arch }}-headless
          path: dist/*
          retention-days: 7

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, headless]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v6
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
